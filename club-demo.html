.method-option{
  min-height:46px;
  border:1px solid var(--line);
  border-radius:6px;
  background:#fff;
  display:grid;
  place-items:center;
  cursor:pointer;
  color:var(--muted);
  font-size:14px;
  font-weight:600;
}
.method-option input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}
.method-option:has(input:checked){
  border-color:var(--green);
  background:var(--green-soft);
  color:var(--green);
}
.compact-field{margin:0;position:relative}
.compact-field .input-unit{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  font-size:13px;
  pointer-events:none;
}
.compact-field input{padding-right:34px}
.field-error{
  min-height:18px;
  margin-top:5px;
  color:var(--red);
  font-size:12px;
  line-height:1.4;
}
.training-category-list{display:grid;gap:8px;margin-top:8px}
.training-category-card{
  width:100%;
  min-height:66px;
  padding:12px 11px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
}
.training-category-card.add-card{margin-bottom:8px}
.training-category-card.edit-mode{min-height:68px}
.training-category-card.dragging{opacity:.55;border-color:var(--green)}
.training-category-card.drop-before{box-shadow:inset 0 3px 0 var(--green)}
.training-category-card.drop-after{box-shadow:inset 0 -3px 0 var(--green)}
.training-history-card.compact{
  display:flex;
  grid-template-columns:none;
  gap:8px;
  padding:8px;
  align-items:stretch;
}
.training-history-open{
  flex:1;
  min-width:0;
  min-height:76px;
  display:grid;
  grid-template-columns:96px minmax(0,1fr) 18px;
  gap:11px;
  align-items:center;
  text-align:left;
}
.training-history-card.compact .training-history-thumb{
  width:96px;
  height:66px;
}
.training-history-copy{
  display:flex;
  flex-direction:column;
  gap:5px;
  min-width:0;
}
.training-history-copy strong{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:14px;
}
.training-history-copy small{
  color:var(--muted);
  font-size:11px;
}
.history-delete{
  align-self:center;
  min-height:40px;
  padding:0 8px;
}
.history-option{
  min-height:48px;
  margin-top:12px;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:14px;
}
.history-option input{
  width:20px;
  height:20px;
  min-height:20px;
}
.training-preview-actions{
  grid-template-columns:1fr 1fr;
}
.training-preview-actions>button:first-child{order:0}
.training-preview-actions>button:last-child{order:1}
@media(max-width:370px){
  .practice-progress{gap:4px;font-size:11px}
  .training-history-open{grid-template-columns:82px minmax(0,1fr) 16px}
  .training-history-card.compact .training-history-thumb{width:82px;height:60px}
}
/* Keep compact time fields inside the two-column editor grid. */
.inline-fields > .compact-field{min-width:0}
.compact-field input{width:100%;min-width:0}
.method-option input[type="radio"]{width:1px;height:1px;min-height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

function renderCalendar(){const y=ui.calendarYear,m=ui.calendarMonth;const first=new Date(y,m,1);const start=new Date(y,m,1-first.getDay());let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const items=state.events.filter(e=>e.date===ds&&(e.kind==='club'||ui.showExec)).map(e=>({title:e.title,cls:e.kind==='executive'?'exec':''}));if(ui.showExec)state.tasks.filter(t=>!t.done&&t.date===ds).forEach(t=>items.push({title:t.title,cls:'task'}));cells+=`<button class="day ${d.getMonth()!==m?'other':''}" data-act="open-day" data-date="${ds}"><span class="day-num">${d.getDate()}</span>${items.slice(0,2).map(e=>`<span class="event-chip ${e.cls}">${esc(e.title)}</span>`).join('')}${items.length>2?`<span class="small muted">＋${items.length-2}</span>`:''}</button>`}return shell('予定','calendar',`<div class="month-head">${action('month','‹','data-dir="-1"','icon-btn')}<h2>${y}年${m+1}月</h2>${action('month','›','data-dir="1"','icon-btn')}</div>${segments([['club','部活のみ'],['all','幹部予定も表示']],ui.showExec?'all':'club','calendar-filter')}<div class="calendar">${'日月火水木金土'.split('').map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div><div class="calendar-footer">${action('calendar-export','画像')}</div>`,'','<a class="icon-btn" href="#event-edit" aria-label="予定を追加">'+icon('plus')+'</a>')}

function renderEvent(id){const e=event(id);if(!e)return shell('予定','calendar','見つかりません','calendar');let extra='';if(e.kind==='club'){const ps=participants(id);extra='<hr class="rule"><h2>参加者</h2>'+[6,5,4,3,2,1].map(g=>{let a=ps.filter(p=>p.grade===g);return a.length?`<h3 class="grade">${g}年</h3><div class="name-list">${a.map(p=>`<span>${esc(p.name)}</span>`).join('')}</div>`:''}).join('')}else extra=`<div class="detail-line">${icon('people')}<span>${esc(e.assignmentNeedsReview?'担当者を確認':aNames(e.assignees))}</span></div>${e.memo?`<p>${esc(e.memo)}</p>`:''}<hr class="rule"><a class="text-btn" href="#task-add-from/${e.id}">やることを追加</a>`;return shell(e.kind==='club'?'部活予定':'幹部予定','calendar',`<h2 class="detail-title">${esc(e.title)}</h2><div class="detail-line">${icon('calendar')}<span>${jpDate(e.date,true)}</span></div>${e.start?`<div class="detail-line">${icon('clock')}<span>${e.start}${e.end?'–'+e.end:''}</span></div>`:''}${e.venueId?`<div class="detail-line">${icon('pin')}<span>${esc(eventVenue(e)?.name||'体育館未設定')}</span></div>`:''}${extra}`,'calendar',`<a class="text-btn" href="#event-edit/${id}">編集</a>`)}

// 配車ドメイン。UIとPNGはこの同じ状態を参照する。
function legOf(p){return p.linked?'outbound':ui.leg}
function carPeople(c){return [...(c.driver?[c.driver]:[]),...c.riders]}
function assigned(p,leg){return new Set(p.legs[leg].flatMap(carPeople))}
function needs(p,leg,mid){const v=p.need[leg]?.[mid];return v===undefined?person(mid)?.seniority==='below':v}
function missing(p,leg){const a=assigned(p,leg);return participants(p.eventId).filter(m=>needs(p,leg,m.id)&&!a.has(m.id))}
function invalid(p){const errors=[];for(const leg of ['outbound','return']){if(!p.enabled[leg])continue;const seen=new Set();for(const c of p.legs[leg]){if(!c.driver)errors.push('運転者を指定');if(carPeople(c).length>4||c.riders.length>3)errors.push('4人まで');for(const mid of carPeople(c)){if(seen.has(mid))errors.push('重複しています');seen.add(mid);if(!participates(p.eventId,mid))errors.push('不参加の人が含まれています')}}if(missing(p,leg).length)errors.push(`${leg==='outbound'?'行き':'帰り'}：未配車${missing(p,leg).length}人`)}return [...new Set(errors)]}
function moveMember(planId,mid,dest,leg=undefined){const p=plan(planId);if(!p)return {ok:false,error:'配車なし'};leg=leg||legOf(p);if(!p.legs[leg]||!dest)return {ok:false,error:'移動先なし'};if(!person(mid)?.active)return {ok:false,error:'部員なし'};if(!participates(p.eventId,mid))return {ok:false,error:'参加者から選択してください'};const cars=clone(p.legs[leg]);cars.forEach(c=>{if(c.driver===mid)c.driver=null;c.riders=c.riders.filter(x=>x!==mid)});const target=cars.find(c=>c.id===dest.carId);if(dest.kind==='new'){cars.push({id:UID(),pickup:dest.pickup||person(mid).pickup,driver:mid,riders:[]})}else if(dest.kind==='driver'){if(!target)return {ok:false,error:'車なし'};target.driver=mid;}else if(dest.kind==='passenger'){if(!target)return {ok:false,error:'車なし'};if(target.riders.length>=3||carPeople(target).length>=4)return {ok:false,error:'4人まで'};target.riders.push(mid);}else if(dest.kind!=='pool'){return {ok:false,error:'移動先なし'}}
 checkpoint();p.legs[leg]=cars;if(p.linked)p.legs[leg==='outbound'?'return':'outbound']=clone(cars);p.status='draft';p.version++;ui.selectedPerson=null;persist();return {ok:true};}
function copyPlan(sourceId,targetId){const src=plan(sourceId),dst=plan(targetId);if(!src||!dst||src===dst)return {ok:false};checkpoint();let removed=new Set();for(const leg of ['outbound','return']){dst.legs[leg]=src.legs[leg].map(c=>{const valid=mid=>{const yes=participates(dst.eventId,mid)&&person(mid)?.active;if(!yes)removed.add(mid);return yes};return {id:UID(),pickup:c.pickup,driver:c.driver&&valid(c.driver)?c.driver:null,riders:c.riders.filter(valid)}});dst.need[leg]={};dst.enabled[leg]=src.enabled[leg]}dst.linked=src.linked;dst.status='draft';dst.unitYen=state.settings.unitYen;dst.sourcePlanId=src.id;dst.version++;persist();return {ok:true,removed:removed.size};}
function addPlan(eid){const exists=state.plans.find(p=>p.eventId===eid);if(exists)return exists;const p={id:UID(),eventId:eid,linked:true,legs:{outbound:[],return:[]},enabled:{outbound:true,return:true},need:{outbound:{},return:{}},status:'draft',version:1,unitYen:state.settings.unitYen};state.plans.unshift(p);persist();return p;}
function renderCarpools(){const ps=state.plans.filter(p=>ui.carTab==='history'?event(p.eventId)?.date<DEMO_TODAY:event(p.eventId)?.date>=DEMO_TODAY).sort((a,b)=>event(a.eventId).date.localeCompare(event(b.eventId).date));return shell('配車','operations',segments([['future','今後'],['history','履歴']],ui.carTab,'car-tab')+ps.map(p=>{const e=event(p.eventId);return `<a class="row" href="#car/${p.id}"><div class="row-main"><div class="row-title">${jpDate(e.date)}　${esc(eventVenue(e)?.name||e.title)}</div><div class="row-sub">${e.start||''}${e.end?'–'+e.end:''}</div></div>${p.status==='draft'?'<span class="small muted">下書き</span>':''}${icon('chev','chev')}</a>`}).join('')+`<hr class="rule">${entry('月次精算','settlement','paper')}`,'operations',`<a class="icon-btn" href="#car-add" aria-label="配車表を追加">${icon('plus')}</a>`)}
function renderCarAdd(){return shell('部活予定を選択','operations',clubEvents().filter(e=>e.date>=DEMO_TODAY).map(e=>`<button class="row" data-act="car-create" data-id="${e.id}"><div class="row-main"><div class="row-title">${jpDate(e.date)}　${esc(eventVenue(e)?.name||'体育館未設定')}</div><div class="row-sub">${e.start||''}${e.end?'–'+e.end:''}　${esc(e.title)}</div></div>${icon('chev','chev')}</button>`).join(''),'carpools')}
function memberChip(mid,needed=false,driver=false){const m=person(mid);return `<button class="person ${needed?'needed':''} ${ui.selectedPerson===mid?'selected':''}" data-act="person-select" data-person="${mid}" title="${esc(m?.name)}"><span class="person-name">${esc(m?.name)}</span><span class="grip" aria-hidden="true">⠿</span></button>`}
function renderCar(id){const p=plan(id);if(!p)return shell('配車','operations','見つかりません','carpools');const e=event(p.eventId),leg=legOf(p),cars=p.legs[leg],used=assigned(p,leg),ps=participants(e.id).filter(m=>!used.has(m.id));const needed=ps.filter(m=>needs(p,leg,m.id)),optional=ps.filter(m=>!needs(p,leg,m.id));const groupHTML=(members,red)=>[6,5,4,3,2,1].map(g=>{const a=members.filter(m=>m.grade===g);return a.length?`<div class="member-grade">${g}年</div>`+a.map(m=>memberChip(m.id,red)).join(''):''}).join('');let left='';for(const [key,label] of [['university','大学配車'],['station','駅配車']]){left+=`<div class="zone-title">${label}</div>`+cars.filter(c=>c.pickup===key).map(c=>`<section class="car" data-car="${c.id}"><div class="car-top"><span class="small ${!c.driver?'red':'muted'}">${!c.driver?'運転者未設定':''}</span><span class="car-count">${carPeople(c).length}/4</span>${action('car-menu',icon('more'),`data-id="${c.id}" aria-label="車の操作"`,'tiny-icon')}</div><div class="driver-slot" data-drop="driver" data-car-id="${c.id}">${icon('wheel')}${c.driver?memberChip(c.driver,false,true):action('drop-tap','運転者',`data-drop="driver" data-car-id="${c.id}"`,'text-btn')}</div>${c.riders.map(mid=>memberChip(mid)).join('')}${c.riders.length<3?action('drop-tap','＋',`data-drop="passenger" data-car-id="${c.id}" aria-label="同乗者を追加"`,'empty-seat'):''}</section>`).join('')+action('new-car',`${icon('plus')}車`, `data-drop="new" data-pickup="${key}"`,'new-car')}
 const right=`<div class="zone-title ${needed.length?'missing-title':''}" data-drop="pool">${needed.length?'未配車 '+needed.length:'未配車 0'}</div><div class="unassigned-target" data-drop="pool">${groupHTML(needed,true)}</div><details open><summary>配車不要${optional.length?' '+optional.length:''}</summary>${groupHTML(optional,false)}</details>`;
 return header('配車','carpools',action('register-car','登録',`data-id="${id}"`,'text-btn'))+`<div class="car-meta"><strong>${jpDate(e.date)}　${esc(eventVenue(e)?.name||'体育館未設定')}</strong></div><div class="car-toolbar">${p.linked?action('split-car','往復 ▾',`data-id="${id}"`,'secondary'):segments([['outbound','行き'],['return','帰り']],leg,'car-leg')}${action('copy-open','コピー',`data-id="${id}"`)}<a class="text-btn" href="#car-table/${id}">表</a>${action('car-options',icon('more'),`data-id="${id}" aria-label="配車設定"`,'tiny-icon')}</div><div class="car-workspace"><div class="scroll-pane cars-pane">${left}</div><aside class="scroll-pane member-pane" aria-label="未配車の部員">${right}</aside></div>`+nav('operations')}
function tableParts(p){const sections=[];const legs=p.linked?['outbound']:['outbound','return'];for(const leg of legs){if(!p.enabled[leg])continue;for(const [k,label] of [['university','大学配車'],['station','駅配車']]){const cs=p.legs[leg].filter(c=>c.pickup===k&&carPeople(c).length);if(cs.length)sections.push({label,leg,legLabel:p.linked?'往復':leg==='outbound'?'行き':'帰り',cars:cs})}}return sections}
function tableHtml(section){const rows=Math.max(1,...section.cars.map(c=>c.riders.length));return `<div class="ride-group">${section.label}${section.legLabel==='往復'?'':'（'+section.legLabel+'）'}</div><div class="table-scroll"><table class="ride-table"><thead><tr>${section.cars.map(c=>`<th scope="col">${esc(pName(c.driver))}</th>`).join('')}</tr></thead><tbody>${Array.from({length:rows},(_,i)=>`<tr>${section.cars.map(c=>`<td>${c.riders[i]?esc(pName(c.riders[i])):''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function renderTable(id){const p=plan(id),e=event(p?.eventId);if(!p||!e)return '';const errors=invalid(p);return shell('配車表','operations',`${errors.length?`<div class="warning no-print">${esc(errors.join('／'))}</div>`:''}<div id="share-table"><h2 class="ride-title">${jpDate(e.date)} ${esc(eventVenue(e)?.name||e.title)}${p.linked?'（往復）':''}</h2>${tableParts(p).map(tableHtml).join('')}</div>`,'car/'+id,action('export-car','共有',`data-id="${id}" ${errors.length?'disabled':''}`,'primary'))}
function settlementLines(month='2026-09'){const map=new Map();for(const p of state.plans){const e=event(p.eventId);if(p.status!=='registered'||e.date>=DEMO_TODAY||!e.date.startsWith(month))continue;for(const leg of ['outbound','return']){if(!p.enabled[leg])continue;for(const c of p.legs[leg]){if(!c.driver)continue;for(const rider of c.riders){if(rider===c.driver)continue;const key=rider+'|'+c.driver;const x=map.get(key)||{rider,driver:c.driver,count:0,amount:0,details:[]};x.count++;x.amount+=Number.isFinite(p.unitYen)?p.unitYen:0;x.unset=x.unset||!Number.isFinite(p.unitYen);x.details.push({date:e.date,leg,amount:p.unitYen,planId:p.id});map.set(key,x)}}}}return [...map.values()].sort((a,b)=>pName(a.driver).localeCompare(pName(b.driver),'ja'))}

document.addEventListener('submit',ev=>{const f=ev.target;if(!f.dataset.form)return;if(['auth','group-create','group-join','group2','event2','notice2','menu','charge','car-options2','member'].includes(f.dataset.form))return;ev.preventDefault();const fd=new FormData(f),get=n=>String(fd.get(n)||'').trim(),ids=fd.getAll('assignee').map(String),notifs=fd.getAll('notify').map(String),id=f.dataset.id;checkpoint();switch(f.dataset.form){case'task':{const old=state.tasks.find(x=>x.id===id);const v={id:id||UID(),title:get('title'),date:get('date'),time:get('time'),assignees:ids,memo:get('memo'),notifications:notifs,done:old?.done||false,relatedEventId:get('related')||undefined,assignmentNeedsReview:false};if(!v.title||!v.date||!v.time)return;old?Object.assign(old,v):state.tasks.push(v);taskSaveMotion(f);persist();go('tasks');break}case'event':{if(get('start')&&get('end')&&get('end')<get('start')){toast('終了時刻を確認してください');return}const old=event(id),v={id:id||UID(),title:get('title'),date:get('date'),start:get('start'),end:get('end'),kind:get('kind'),venueId:get('venue'),assignees:ids,memo:get('memo'),notifications:notifs};old?Object.assign(old,v):state.events.push(v);if(v.kind==='club')state.people.forEach(m=>{const k=v.id+'|'+m.id;if(!(k in state.attendance))state.attendance[k]=m.defaultOverride??(m.seniority==='below')});persist();go('event/'+v.id);break}case'notice':{const old=state.notices.find(n=>n.id===id),v={id:id||UID(),title:get('title'),body:get('body'),assignees:ids,notify:fd.has('push'),author:old?.author||oName(state.currentUser),date:old?.date||DEMO_TODAY};old?Object.assign(old,v):state.notices.unshift(v);persist();go('notices');break}case'venue':{const v={id:id||UID(),name:get('name'),courts:Number(get('courts')),memo:get('memo')};if(!v.name||!Number.isInteger(v.courts)||v.courts<1)return;const old=venue(id);old?Object.assign(old,v):state.venues.push(v);persist();go('venues');break}case'equipment':{const v={id:id||UID(),name:get('name'),quantity:Number(get('quantity')),unit:get('unit'),memo:get('memo'),threshold:get('threshold')===''?null:Number(get('threshold'))};if(!Number.isFinite(v.quantity)||v.quantity<0||!v.name)return;const old=state.equipment.find(x=>x.id===id);old?Object.assign(old,v):state.equipment.push(v);persist();go('equipment');break}case'member':{const old=person(id),v={id:id||UID(),name:get('name'),grade:Number(get('grade')),seniority:get('seniority'),pickup:get('pickup'),memo:get('memo'),defaultOverride:get('defaultOverride')==='default'?null:get('defaultOverride')==='true',active:true};old?Object.assign(old,v):state.people.push(v);if(!old)clubEvents().filter(e=>e.date>=DEMO_TODAY).forEach(e=>state.attendance[e.id+'|'+v.id]=v.defaultOverride??(v.seniority==='below'));persist();go('members');break}case'group':state.group.name=get('name');persist();go('settings');break;case'notifications':state.settings.reminders=notifs;persist();go('settings');break;case'carsettings':state.settings.unitYen=get('unitYen')===''?null:Number(get('unitYen'));persist();go('settings');break;case'role':state.roles[f.dataset.name]=ids;persist();closeModal();render();break}if(typeof ctx==='undefined'||ctx.mode==='demo')toast('保存しました');});

function scrollDrag(){if(!drag?.active)return;const hit=document.elementFromPoint(drag.x,drag.y);const pane=hit?.closest('.scroll-pane');if(pane){const r=pane.getBoundingClientRect();if(drag.y<r.top+28)pane.scrollTop-=7;else if(drag.y>r.bottom-28)pane.scrollTop+=7}scrollFrame=requestAnimationFrame(scrollDrag)}

function drawCarCanvas(id){const p=plan(id),e=event(p.eventId),parts=tableParts(p);const colW=168,pad=30,rowsH=46,headH=48;const width=Math.max(520,pad*2+Math.max(1,...parts.map(s=>s.cars.length))*colW);let height=95+parts.reduce((a,s)=>a+40+headH+Math.max(1,...s.cars.map(c=>c.riders.length))*rowsH+20,0);const canvas=document.createElement('canvas');canvas.width=width*2;canvas.height=height*2;const c=canvas.getContext('2d');c.scale(2,2);c.fillStyle='#fff';c.fillRect(0,0,width,height);c.fillStyle='#18211c';c.font='600 22px "Noto Sans CJK JP", sans-serif';c.fillText(`${jpDate(e.date)} ${eventVenue(e)?.name||e.title}${p.linked?'（往復）':''}`,pad,43);let y=85;for(const s of parts){c.fillStyle='#3e5044';c.font='500 14px "Noto Sans CJK JP", sans-serif';c.fillText(s.label+(p.linked?'':'（'+s.legLabel+'）'),pad,y);y+=15;const rows=Math.max(1,...s.cars.map(c=>c.riders.length));s.cars.forEach((car,i)=>{const x=pad+i*colW;c.fillStyle='#edf7f0';c.fillRect(x,y,colW,headH);c.strokeStyle='#dce5df';c.lineWidth=1;c.strokeRect(x,y,colW,headH);c.textAlign='center';c.fillStyle='#18211c';c.font='600 18px "Noto Sans CJK JP", sans-serif';c.fillText(pName(car.driver),x+colW/2,y+31);for(let k=0;k<rows;k++){c.strokeRect(x,y+headH+k*rowsH,colW,rowsH);c.font='400 17px "Noto Sans CJK JP", sans-serif';if(car.riders[k])c.fillText(pName(car.riders[k]),x+colW/2,y+headH+k*rowsH+29)}c.textAlign='left'});y+=headH+rows*rowsH+43}return canvas;}
async function exportCar(id){if(invalid(plan(id)).length){toast('未配車・運転者を確認してください');return}const canvas=drawCarCanvas(id);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob){toast('画像を作成できませんでした');return}const e=event(plan(id).eventId),filename=`配車表_${e.date}.png`;const file=new File([blob],filename,{type:'image/png'});try{if(navigator.canShare?.({files:[file]})&&navigator.share){await navigator.share({files:[file],title:'配車表'});return}}catch(err){if(err.name==='AbortError')return}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}

function sortedTrainingMenus(list=state.training.menus){return [...list].sort((a,b)=>categoryIndex(a.categoryId)-categoryIndex(b.categoryId)||(a.order??0)-(b.order??0)||String(a.name).localeCompare(String(b.name),'ja'));}

function renderPracticeSets(){const d=practiceDraft;if(!d)return shell('練習メニュー','operations','<p class="empty">メニュー表を選択してください</p>','practice');let t;try{t=D.trainingTotals(d.rows,d.patterns)}catch(err){return shell('練習メニュー','operations',esc(err.message),'practice-select');}const changed=d.eventId&&JSON.stringify(d.context)!==JSON.stringify(sessionInfo(d.eventId));const tooLong=d.context?.minutes!==null&&d.context?.minutes!==undefined&&t.patterns.some(p=>t.totals[p].seconds>d.context.minutes*60);return shell('セット数・人数','operations',`<div class="practice-progress" aria-label="作成の進行状況"><span>1 メニュー</span><span class="active">2 セット</span><span>3 出力</span></div><h2>${esc(d.title)}</h2>${d.context?`<div class="session-compact">${sessionSummary(d.context)}</div>`:''}${changed?`<div class="warning">予定・出欠が変更されています ${action('practice-refresh','反映')}</div>`:''}<div class="section-head"><span class="small muted">比較する人数を2つまで選択</span>${action('practice-patterns',d.patterns.map(p=>p+'人').join(' / ')||'未選択','','text-btn')}</div><table class="set-table"><thead><tr><th>メニュー</th>${d.patterns.map(p=>`<th>${p}人</th>`).join('')}</tr></thead><tbody>${d.rows.map((r,i)=>`<tr><td><div class="set-name">${esc(r.name)}</div><div class="row-sub">${D.secondsText(r.seconds)} / ${r.requiresSets?'1set・1人':'1回のみ'}</div><div class="reorder">${action('practice-order','↑',`data-index="${i}" data-step="-1" ${i===0?'disabled':''} aria-label="${i+1}番を上へ"`,'')}${action('practice-order','↓',`data-index="${i}" data-step="1" ${i===d.rows.length-1?'disabled':''} aria-label="${i+1}番を下へ"`,'')}${action('practice-remove','×',`data-index="${i}" aria-label="${i+1}番を外す"`,'')}</div></td>${r.requiresSets?d.patterns.map(p=>`<td>${setsControl(i,p,r.sets[p]??0)}</td>`).join(''):`<td colspan="${Math.max(d.patterns.length,1)}"><span class="once-pill">1回のみ</span></td>`}</tr>`).join('')}</tbody><tfoot><tr><th>合計人set</th>${d.patterns.map(p=>`<td>${t.totals[p].peopleSets} 人set</td>`).join('')}</tr></tfoot></table><div class="total-time pattern-times"><span>所要時間</span><div>${t.patterns.map(p=>`<strong><small>${p}人</small>${D.secondsText(t.totals[p].seconds)}</strong>`).join('')}</div></div>${t.mismatch?'<div class="warning">人数パターンごとに、メニュー別の人setが一致していません。</div>':''}${tooLong?'<div class="warning">練習時間を超える人数パターンがあります。</div>':''}<div class="form-actions">${action('practice-preview','画像を確認','','primary full')}${action('practice-save','表を保存','','secondary full')}</div>`,'practice-select');}
renderPracticeSaved=function(){const hist=[...state.training.history].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));const cards=hist.map(h=>{let src='';try{src=drawTraining(h.snapshot).toDataURL('image/png')}catch{}const when=h.createdAt?new Date(h.createdAt).toLocaleString('ja-JP'):'';return `<article class="training-history-card compact"><button class="training-history-open" data-act="practice-history-open" data-id="${h.id}" aria-label="${esc(h.title||'練習メニュー')}を開く"><span class="training-history-thumb">${src?`<img src="${src}" alt="">`:'<span class="empty-thumb">画像</span>'}</span><span class="training-history-copy"><strong>${esc(h.title||'練習メニュー')}</strong><small>${esc(when)}</small></span>${icon('chev','chev')}</button>${practiceHistoryEdit&&edit('training')?action('practice-history-delete','削除',`data-id="${h.id}"`,'text-btn danger-button history-delete'):''}</article>`}).join('');const empty=edit('training')?`<div class="training-empty"><p>履歴がありません</p><a class="secondary empty-action" href="#practice-new">メニュー表を作成</a></div>`:'<p class="empty">履歴がありません</p>';const sheets=[...state.training.sheets].sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));const saved=sheets.length?`<details class="advanced saved-practice-details"><summary>保存したメニュー表（${sheets.length}件）</summary><div class="saved-practice-list">${sheets.map(x=>`<a class="row" href="#practice-sheet/${x.id}"><span class="row-main"><span class="row-title">${esc(x.title)}</span><span class="row-sub block">${x.updatedAt?esc(new Date(x.updatedAt).toLocaleString('ja-JP')):''}</span></span>${icon('chev','chev')}</a>`).join('')}</div></details>`:'';return shell('練習メニュー履歴','operations',(cards||empty)+saved,'practice',edit('training')?action('practice-history-edit-toggle',practiceHistoryEdit?'完了':'編集','','text-btn'):'');};
function renderPracticeSheet(id){const s=state.training.sheets.find(s=>s.id===id);if(!s)return shell('練習メニュー','operations','見つかりません','practice-saved');const t=D.trainingTotals(s.rows,s.patterns);return shell('練習メニュー','operations',`<h2 class="detail-title">${esc(s.title)}</h2>${s.context?`<div class="session-compact">${sessionSummary(s.context)}</div>`:''}<table class="set-table preview"><thead><tr><th>種目</th>${s.patterns.map(p=>`<th>${p}人</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr><td><div>${esc(r.name)}</div><div class="row-sub">${D.secondsText(r.seconds)} / ${r.requiresSets?'1人・1セット':'1回'}</div></td>${r.requiresSets?s.patterns.map(p=>`<td>${r.sets[p]||0} set</td>`).join(''):`<td colspan="${Math.max(1,s.patterns.length)}">1回</td>`}</tr>`).join('')}</tbody><tfoot><tr><th>合計人set</th>${s.patterns.map(p=>`<td>${t.totals[p].peopleSets} 人set</td>`).join('')}</tr></tfoot></table><div class="total-time pattern-times"><span>所要時間</span><div>${t.patterns.map(p=>`<strong><small>${p}人</small>${D.secondsText(t.totals[p].seconds)}</strong>`).join('')}</div></div><div class="form-actions">${action('practice-image','画像出力',`data-id="${s.id}"`,'secondary full')}${edit('training')?action('practice-copy','複製',`data-id="${s.id}"`,'secondary full'):''}</div>`,'practice-saved',edit('training')?action('practice-edit','編集',`data-id="${s.id}"`):'');}
function renderPracticeCategories(){const rows=state.training.categories.map(c=>{const used=state.training.menus.filter(m=>m.categoryId===c.id).length;if(!practiceCategoryEdit)return `<button class="training-category-card" data-act="category-edit" data-id="${c.id}"><span class="row-main"><span class="row-title">${esc(c.name)}</span><span class="row-sub">登録メニュー ${used}件</span></span>${icon('chev','chev')}</button>`;return `<div class="training-category-card edit-mode" data-category-id="${c.id}"><button class="menu-drag-handle" data-category-drag="${c.id}" aria-label="${esc(c.name)}を並び替える">☰</button><span class="row-main"><span class="row-title">${esc(c.name)}</span><span class="row-sub">登録メニュー ${used}件</span></span>${action('category-delete','削除',`data-id="${c.id}"`,'text-btn danger-button')}</div>`}).join('')||'<p class="empty">分類はありません</p>';const add=edit('training')?`<button class="training-category-card add-card" data-act="category-add"><span class="row-main"><span class="row-title">＋ 分類を追加</span></span>${icon('chev','chev')}</button>`:'';return shell('分類一覧','operations',add+`<div class="training-category-list">${rows}</div>`,'practice',edit('training')?action('category-edit-toggle',practiceCategoryEdit?'完了':'編集','','text-btn'):'');}

function reorderCategoryRelative(sourceId,targetId,position){const list=[...state.training.categories],from=list.findIndex(c=>c.id===sourceId);let to=list.findIndex(c=>c.id===targetId);if(from<0||to<0||sourceId===targetId)return false;checkpoint();const [item]=list.splice(from,1);to=list.findIndex(c=>c.id===targetId);if(position==='after')to++;list.splice(to,0,item);state.training.categories=list;persist();render();toast(`${item.name}を${to+1}番目に移動しました`,true);return true;}

function reorderMenuRelative(sourceId,targetId,position){const source=state.training.menus.find(m=>m.id===sourceId),target=state.training.menus.find(m=>m.id===targetId);if(!source||!target||source.id===target.id||source.categoryId!==target.categoryId)return false;const siblings=sortedTrainingMenus(state.training.menus.filter(m=>m.categoryId===source.categoryId)),ids=siblings.map(m=>m.id).filter(id=>id!==sourceId);let at=ids.indexOf(targetId);if(at<0)return false;if(position==='after')at++;ids.splice(at,0,sourceId);ids.forEach((id,i)=>{const m=state.training.menus.find(x=>x.id===id);if(m)m.order=i;});persist();render();return true;}
document.addEventListener('pointerdown',ev=>{const handle=ev.target.closest('[data-category-drag]');if(!handle||!practiceCategoryEdit||getRoute()[0]!=='practice-categories'||ev.button!==0)return;const card=handle.closest('.training-category-card[data-category-id]');if(!card)return;ev.preventDefault();categoryDrag={pointerId:ev.pointerId,sourceId:card.dataset.categoryId,startX:ev.clientX,startY:ev.clientY,active:false,targetId:null,position:null,handle,card};try{handle.setPointerCapture(ev.pointerId)}catch{}},{capture:true});

document.addEventListener('pointerup',ev=>{if(!categoryDrag||ev.pointerId!==categoryDrag.pointerId)return;const {active,sourceId,targetId,position}=categoryDrag;cleanupCategoryDrag();if(active&&targetId&&position)reorderCategoryRelative(sourceId,targetId,position);},{capture:true});

function saveSheet(d){if(!d.title.trim()||!d.rows.length)throw Error('種目を選択してください');D.trainingTotals(d.rows,d.patterns);const saved=clone(d);saved.updatedAt=new Date().toISOString();saved.updatedBy=state.currentUser;const ix=state.training.sheets.findIndex(s=>s.id===d.id);if(ix<0)state.training.sheets.push(saved);else state.training.sheets[ix]=saved;persist();return saved;}
function measureLines(c,text,max){const out=[];for(const para of String(text).split('\n')){let line='';for(const ch of para){if(c.measureText(line+ch).width>max&&line){out.push(line);line='';}line+=ch;}out.push(line);}return out;}
function imageCanvas(w,h){const cv=document.createElement('canvas');cv.width=w*2;cv.height=h*2;const c=cv.getContext('2d');c.scale(2,2);c.fillStyle='#fff';c.fillRect(0,0,w,h);c.fillStyle='#18211c';c.font='16px "Noto Sans CJK JP", sans-serif';return [cv,c];}
function drawTraining(s){const t=D.trainingTotals(s.rows,s.patterns),w=820;const rows=s.rows.map(r=>({...r,lines:Math.ceil(r.name.length/18)}));const h=235+rows.reduce((v,r)=>v+Math.max(62,r.lines*26+24),0);const [cv,c]=imageCanvas(w,h);c.font='600 25px "Noto Sans CJK JP", sans-serif';const title=measureLines(c,s.title,w-60);title.forEach((l,i)=>c.fillText(l,30,40+i*30));c.font='14px "Noto Sans CJK JP", sans-serif';let y=52+title.length*30;c.fillStyle='#717a74';if(s.context){c.fillText(`${jpDate(s.context.date)} ${s.context.venue}　${s.context.participants}人${s.context.courts?' / '+s.context.courts+'面':''}`,30,y);y+=28;}c.fillText(`所要時間　${timeSummary(t)}`,30,y);y+=22;c.fillText(`合計人set　${t.patterns.map(p=>p+'人：'+t.totals[p].peopleSets).join(' / ')}`,30,y);y+=26;c.fillStyle='#edf7f0';c.fillRect(30,y,w-60,40);c.fillStyle='#18211c';c.font='600 15px "Noto Sans CJK JP", sans-serif';c.fillText('種目',45,y+26);s.patterns.forEach((p,i)=>c.fillText(p+'人',520+i*100,y+26));y+=40;for(const r of rows){const rh=Math.max(62,r.lines*26+24);c.strokeStyle='#e5e9e6';c.strokeRect(30,y,w-60,rh);c.fillStyle='#18211c';c.font='16px "Noto Sans CJK JP", sans-serif';measureLines(c,r.name,430).forEach((l,i)=>c.fillText(l,45,y+27+i*25));c.font='12px "Noto Sans CJK JP", sans-serif';c.fillStyle='#717a74';c.fillText(`${D.secondsText(r.seconds)} / ${r.requiresSets?'1人・1セット':'1回'}`,45,y+rh-10);c.fillStyle='#18211c';c.font='14px "Noto Sans CJK JP", sans-serif';s.patterns.forEach((p,i)=>c.fillText(r.requiresSets?`${r.sets[p]||0} set`:'1回',520+i*100,y+29));y+=rh;}return cv;}
async function shareCanvas(cv,filename){const blob=await new Promise(r=>cv.toBlob(r,'image/png'));if(!blob)throw Error('画像を生成できませんでした');const file=new File([blob],filename,{type:'image/png'});if(navigator.canShare?.({files:[file]})&&navigator.share){try{await navigator.share({files:[file]});return}catch(err){if(err.name==='AbortError')return;}}const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);}

function drawCalendar(withExec=false,personal=false){
 const y=ui.calendarYear,m=ui.calendarMonth,offset=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),weeks=Math.ceil((offset+days)/7),cw=155,w=cw*7+48;
 const probe=document.createElement('canvas').getContext('2d');probe.font='13px "Noto Sans CJK JP", sans-serif';
 const cells=Array.from({length:weeks*7},(_,i)=>{const day=i-offset+1;if(day<1||day>days)return {day:null,blocks:[]};const dt=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;return {day,blocks:(personal?calItems(dt,true):D.calendarItems(state,dt,withExec)).map(item=>({kind:item.kind,colorId:event(item.id)?.colorId,lines:[...(item.kind!=='club'&&item.time?[item.time+(item.end?'–'+item.end:'')]:[]),...measureLines(probe,item.title,cw-18),...(typeof calVenueName==='function'&&calVenueName(item)?measureLines(probe,calVenueName(item),cw-18):[])]}))};});
 const rh=Array.from({length:weeks},(_,wi)=>Math.max(100,...cells.slice(wi*7,wi*7+7).map(cell=>42+cell.blocks.reduce((a,b)=>a+b.lines.length*18+10,0))));const h=100+rh.reduce((a,b)=>a+b,0);if(h>12000)throw Error('予定が多すぎるため、この月を1枚に出力できません');
 const [cv,c]=imageCanvas(w,h);c.font='600 24px "Noto Sans CJK JP", sans-serif';c.fillText(`${y}年${m+1}月　${personal?'自分のやること':withExec?'幹部予定も表示':'部活予定'}`,24,42);c.font='15px "Noto Sans CJK JP", sans-serif';'日月火水木金土'.split('').forEach((v,i)=>c.fillText(v,24+i*cw+cw/2,80));let py=96;
 for(let wi=0;wi<weeks;wi++){for(let col=0;col<7;col++){const cell=cells[wi*7+col],x=24+col*cw;c.strokeStyle='#dce5df';c.strokeRect(x,py,cw,rh[wi]);if(!cell.day)continue;c.fillStyle='#18211c';c.font='600 15px "Noto Sans CJK JP", sans-serif';c.fillText(String(cell.day),x+10,py+24);let ty=py+48;for(const block of cell.blocks){c.fillStyle=typeof calColor==='function'?calColor(block):(block.kind==='club'?'#14813b':'#455969');c.fillRect(x+4,ty-15,cw-8,block.lines.length*18+4);c.fillStyle='#242522';c.font='13px "Noto Sans CJK JP", sans-serif';for(const line of block.lines){c.fillText(line,x+9,ty);ty+=18;}ty+=10;}}py+=rh[wi];}return cv;
}

copyPlan=function(srcid,dstid){const src=plan(srcid),dst=plan(dstid);if(!src||!dst||src===dst||lockedPlan(dstid)||!edit('plans'))return {ok:false,removed:0};checkpoint();const removed=new Set();for(const leg of ['outbound','return']){dst.legs[leg]=src.legs[leg].map(c=>{const valid=mid=>{const yes=D.participating(state,dst.eventId,mid);if(!yes)removed.add(mid);return yes;};return {id:UID(),pickup:c.pickup,driver:c.driver&&valid(c.driver)?c.driver:null,riders:c.riders.filter(valid)};});dst.need[leg]={};dst.enabled[leg]=src.enabled[leg];}dst.linked=src.linked;if(dst.linked)dst.legs.return=clone(dst.legs.outbound);dst.status='draft';if(dst.unitYen===undefined)dst.unitYen=state.settings.unitYen;dst.sourcePlanId=src.id;dst.version++;dst.adjustments={};dst.legDates=dst.legDates||{outbound:event(dst.eventId).date,return:event(dst.eventId).endDate||event(dst.eventId).date};dst.notifications=dst.notifications||[...state.settings.reminders];persist();return {ok:true,removed:removed.size};};

drawCarCanvas=function(id){
 const p=plan(id),e=event(p.eventId),parts=tableParts(p),colW=168,pad=30,w=Math.max(520,60+Math.max(1,...parts.map(x=>x.cars.length))*colW),probe=document.createElement('canvas').getContext('2d');
 const font=(size,bold=false)=>`${bold?'600':'400'} ${size}px "Noto Sans CJK JP", sans-serif`;
 probe.font=font(22,true);const title=`${jpDate(e.date)}${e.endDate&&e.endDate!==e.date?'〜'+jpDate(e.endDate):''} ${eventVenue(e)?.name||e.title}${p.linked?'（往復）':''}`,titleLines=measureLines(probe,title,w-60);
 const blocks=parts.map(part=>{probe.font=font(18,true);const headers=part.cars.map(c=>measureLines(probe,pName(c.driver),colW-20));const hh=Math.max(48,...headers.map(ls=>ls.length*24+18));const rowCount=Math.max(1,...part.cars.map(c=>c.riders.length));probe.font=font(17);const cells=part.cars.map(c=>Array.from({length:rowCount},(_,i)=>c.riders[i]?measureLines(probe,pName(c.riders[i]),colW-20):[]));const rh=Array.from({length:rowCount},(_,i)=>Math.max(46,...cells.map(a=>a[i].length*24+18)));return {part,headers,hh,cells,rh};});
 const h=45+titleLines.length*31+blocks.reduce((sum,b)=>sum+40+b.hh+b.rh.reduce((a,c)=>a+c,0)+24,0);if(w>8000||h>12000)throw Error('画像にするデータが大きすぎます');const [cv,c]=imageCanvas(w,h);c.fillStyle='#18211c';c.font=font(22,true);titleLines.forEach((l,i)=>c.fillText(l,pad,38+i*31));let y=55+titleLines.length*31;
 for(const b of blocks){c.fillStyle='#3e5044';c.font=font(14);c.fillText(b.part.label+(p.linked?'':'（'+b.part.legLabel+'）'),pad,y);y+=16;b.part.cars.forEach((car,i)=>{const x=pad+i*colW;c.fillStyle='#edf7f0';c.fillRect(x,y,colW,b.hh);c.strokeStyle='#dce5df';c.strokeRect(x,y,colW,b.hh);c.fillStyle='#18211c';c.textAlign='center';c.font=font(18,true);b.headers[i].forEach((line,j)=>c.fillText(line,x+colW/2,y+30+j*24));let cy=y+b.hh;c.font=font(17);b.rh.forEach((rh,k)=>{c.strokeRect(x,cy,colW,rh);b.cells[i][k].forEach((line,j)=>c.fillText(line,x+colW/2,cy+29+j*24));cy+=rh;});c.textAlign='left';});y+=b.hh+b.rh.reduce((a,r)=>a+r,0)+48;}return cv;

function editableRoute(route){const maps={'event-edit':'events','task-edit':'tasks','task-add-from':'tasks','notice-edit':'notices','member-edit':'people','venue-edit':'venues','equipment-edit':'equipment','menu-edit':'training','practice-new':'training','practice-select':'training','practice-sets':'training','practice-categories':'training'};return !maps[route]||edit(maps[route]);}

 if(html!==null){document.body.classList.remove('wide');document.getElementById('app').innerHTML=html;}
 else origRender();
 // Module list links remain visible; unauthorized edit actions do not.
 if(!edit('tasks'))document.querySelectorAll('[href^="#task-edit"],[href^="#task-add-from"]').forEach(e=>e.remove());

 if(!edit('people'))document.querySelectorAll('[href="#member-edit"]').forEach(e=>e.remove());
 if(!edit('venues'))document.querySelectorAll('[href="#venue-edit"]').forEach(e=>e.remove());

let focusBefore=null;
modal=function(title,content){focusBefore=document.activeElement;origModal(title,content);setTimeout(()=>document.querySelector('.modal button,.modal input,.modal a')?.focus(),0);};
closeModal=function(){origClose();if(focusBefore?.isConnected)focusBefore.focus();focusBefore=null;};
document.addEventListener('keydown',ev=>{const m=document.querySelector('.modal');if(!m)return;if(ev.key==='Escape'){closeModal();ev.preventDefault();}if(ev.key==='Tab'){const a=[...m.querySelectorAll('button:not([disabled]),input:not([disabled]),select,textarea,a[href],summary')].filter(x=>x.getClientRects().length);if(!a.length)return;if(ev.shiftKey&&document.activeElement===a[0]){a.at(-1).focus();ev.preventDefault();}else if(!ev.shiftKey&&document.activeElement===a.at(-1)){a[0].focus();ev.preventDefault();}}});

function mutationPermission(act){const groups={events:['cancel-event'],tasks:['delete-task'],notices:['delete-notice'],attendance:['attendance-toggle'],people:[],plans:['register-car','new-car','car-menu','delete-car','copy-open','copy-apply','split-apply','merge-apply','leg-enabled','need-toggle','assign-choice','charge-edit','statement-lock','statement-reopen'],equipment:['stock'],training:['practice-defaults','practice-save','practice-draft-save','practice-edit','practice-copy','practice-history-add','practice-history-delete','practice-history-edit-toggle','menu-delete','category-add','category-edit','category-delete','category-save','category-edit-toggle','menu-reorder-toggle','menu-move','training-import']};for(const [k,acts]of Object.entries(groups))if(acts.includes(act))return edit(k);if(['role-edit','invite2','operator-transfer','operator-remove'].includes(act))return own();return true;}

async function enablePush(){if(ctx.mode!=='server'){toast('デモでは通知送信しません');return;}if(!ctx.pushConfig.push){toast('送信サーバーの設定が必要です');return;}if(!('serviceWorker'in navigator)||!('PushManager'in window)){toast('ホーム画面から開いてください');return;}if(await Notification.requestPermission()!=='granted'){toast('通知は許可されていません');return;}const sw=await navigator.serviceWorker.ready;const str=ctx.pushConfig.vapidPublic.replace(/-/g,'+').replace(/_/g,'/'),bytes=Uint8Array.from(atob(str+'='.repeat((4-str.length%4)%4)),c=>c.charCodeAt(0));const sub=await sw.pushManager.getSubscription()||await sw.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes});await api('/push/subscription','POST',{subscription:sub.toJSON()});toast('この端末を登録しました');render();}

 case'switch-group':await switchGroup(d.id);break;
 case'logout2':await api('/logout','POST',{});ctx.user=null;ctx.base=null;ctx.csrf='';state=demoSeed();render();break;
 case'invite2':if(ctx.mode==='demo'){toast('招待はサーバー版で利用できます');break;}const inv=await api('/groups/'+state.group.id+'/invite','POST',{});modal('招待',`<p class="note">7日間有効・1回限り</p><textarea readonly aria-label="招待リンク" style="margin-top:12px">${esc(location.origin+'/?invite='+inv.token)}</textarea>`);break;

function courtRankRects(){return new Map([...document.querySelectorAll('[data-rank-person]')].map(el=>[el.dataset.rankPerson,el.getBoundingClientRect()]));}
function courtRankAnimate(before,moved){if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;document.querySelectorAll('[data-rank-person]').forEach(el=>{const old=before.get(el.dataset.rankPerson),now=el.getBoundingClientRect();if(old&&el.animate){const dx=old.left-now.left,dy=old.top-now.top;if(dx||dy)el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,0)'}],{duration:240,easing:'cubic-bezier(.2,.8,.2,1)'});if(el.dataset.rankPerson===moved)el.animate([{backgroundColor:'#dcefe0'},{backgroundColor:'#ffffff'}],{duration:650});}});}
function courtMove(id,index,before=courtRankRects()){const i=courtUI.rank?.indexOf(id);if(i===undefined||i<0)return;courtUI.rank.splice(i,1);courtUI.rank.splice(Math.max(0,Math.min(index,courtUI.rank.length)),0,id);const y=window.scrollY;render();window.scrollTo(0,y);courtRankAnimate(before,id);}
window.addEventListener('change',ev=>{if(ev.target.matches('[data-court-date]')){courtUI.eventId=ev.target.value;render();}if(ev.target.matches('[data-court-rank]')&&edit('courtAssignments')&&!ctx.busy)courtMove(ev.target.dataset.courtRank,Number(ev.target.value));});
window.addEventListener('click',async ev=>{
 const b=ev.target.closest('[data-act^="court-"]');if(!b||b.disabled)return;actHandled(ev);const d=b.dataset;
 if(d.act==='court-mode'){courtUI.mode=d.value;render();return;}
 try{
  if(ctx.busy||!edit('courtAssignments'))throw Error('コート割の編集権限を確認してください');
  if(d.act==='court-rank-save'){const rank=[...courtUI.rank];await wfSave(()=>{state.courtAssignments||={ranking:[],sessions:{}};state.courtAssignments.ranking=rank;});courtUI.rank=null;go('courts');return;}
  if(d.act==='court-create'||d.act==='court-shuffle'){
   const e=event(courtUI.eventId),gym=e&&eventVenue(e),ranked=e?courtParticipants(e.id):[];
   if(!e||e.cancelled||!gym?.courts||!ranked.length||ranked.length!==participants(e.id).length)throw Error('日程・体育館・参加者のレベル順を確認してください');
   const data=CourtDomain.create(ranked,gym.courts),source=courtSnapshot(e.id);
   if(d.act==='court-shuffle'&&(!courtData().sessions[e.id]||courtStale(courtData().sessions[e.id],e.id)))throw Error('先に再作成してください');
   await wfSave(()=>{state.courtAssignments||={ranking:[],sessions:{}};const old=state.courtAssignments.sessions[e.id];state.courtAssignments.sessions[e.id]={source,level:d.act==='court-shuffle'?old.level:data.level,balanced:data.balanced,updatedAt:new Date().toISOString()};});go('court-result/'+e.id+'/'+courtUI.mode);render();toast('保存しました');
  }
 }catch(error){toast(error.message);}
},true);
const courtPreviousOperations=renderOperations;
renderOperations=function(){return courtPreviousOperations().replace(entry('体育館','venues','calendar'),entry('体育館','venues','calendar')+entry('コート割','courts','people'));};
// Enter through the existing route/auth guard; never render a group before login.
const courtPreviousRoute=wfRenderRoute;
wfRenderRoute=function(r,id,extra){const guarded=courtPreviousRoute(r,id,extra);if(guarded!==null)return guarded;if(r==='court-result')return renderCourtResult(id,extra);if(r==='courts')return renderCourts();if(r==='court-ranking')return renderCourtRanking();return null;};
window.addEventListener('hashchange',()=>{if(getRoute()[0]!=='court-ranking')courtUI.rank=null;});
if(ctx.ready)render();

window.addEventListener('toggle',ev=>{const month=ev.target.dataset?.courtMonth;if(month)courtUI.months[month]=ev.target.open;},true);
window.addEventListener('click',ev=>{if(ev.target.closest('[data-court-attendance]')){ui.attendanceMode='date';ui.attendanceEvent=courtUI.eventId;}},true);
</script><script>'use strict';
let courtPress=null,courtDrag=null,courtDragFrame=0,courtDragSuppress=0;
function courtDragAllowed(){return getRoute()[0]==='court-ranking'&&edit('courtAssignments')&&!ctx.busy&&!ctx.conflict;}
function courtDragStart(){
 const p=courtPress;if(!p||!p.row.isConnected||!courtDragAllowed())return courtDragClean();
 const rows=[...document.querySelectorAll('[data-rank-person]')],from=rows.indexOf(p.row);if(from<0)return courtDragClean();
 window.getSelection?.()?.removeAllRanges();
 const box=p.row.getBoundingClientRect(),ghost=p.row.cloneNode(true);ghost.removeAttribute('data-rank-person');ghost.classList.add('court-rank-ghost');ghost.setAttribute('aria-hidden','true');ghost.inert=true;
 Object.assign(ghost.style,{left:box.left+'px',top:box.top+'px',width:box.width+'px',height:box.height+'px'});document.body.appendChild(ghost);
 courtDrag={rows,from,to:from,id:p.row.dataset.rankPerson,ghost,height:box.height,offset:p.y-box.top,y:p.y};p.row.classList.add('court-rank-lifted');rows.forEach(el=>el.classList.add('court-rank-sorting'));courtDragTick();
}
function courtDragPosition(y){
 const d=courtDrag;if(!d)return;d.y=y;d.ghost.style.top=(y-d.offset)+'px';
 const start=d.rows[0].parentElement.getBoundingClientRect().top,center=y-d.offset+d.height/2;
 d.to=Math.max(0,Math.min(d.rows.length-1,Math.floor((center-start)/d.height)));
 d.rows.forEach((el,i)=>{const shift=i===d.from?0:d.to>d.from&&i>d.from&&i<=d.to?-d.height:d.to<d.from&&i>=d.to&&i<d.from?d.height:0;el.dataset.rankShift=String(shift);el.style.transform=`translateY(${shift}px)`;});
}
function courtDragTick(){
 const d=courtDrag;if(!d)return;if(!courtDragAllowed()||!d.rows[0].isConnected){courtDragClean();return;}
 const delta=d.y<110?-8:d.y>window.innerHeight-90?8:0;if(delta)window.scrollBy(0,delta);courtDragPosition(d.y);courtDragFrame=requestAnimationFrame(courtDragTick);
}
function courtDragClean(){
 clearTimeout(courtPress?.timer);cancelAnimationFrame(courtDragFrame);courtDragFrame=0;
 if(courtDrag){courtDrag.ghost.remove();courtDrag.rows.forEach(el=>{el.style.transform='';delete el.dataset.rankShift;el.classList.remove('court-rank-sorting','court-rank-lifted');});}
 courtDrag=null;courtPress=null;
}
function courtDragFinish(cancel=false){
 const d=courtDrag;if(!d){courtDragClean();return;}
 const before=courtRankRects();before.set(d.id,d.ghost.getBoundingClientRect());const allowed=courtDragAllowed();courtDragSuppress=Date.now()+500;courtDragClean();
 if(!cancel&&allowed&&d.to!==d.from)courtMove(d.id,d.to,before);else courtRankAnimate(before,d.id);
}
function courtDragPress(ev,x,y,touch,id){
 if(!courtDragAllowed()||ev.target.closest('select,input,a')||(ev.target.closest('button')&&!ev.target.closest('[data-rank-drag]')))return;
 const row=ev.target.closest('[data-rank-person]');if(!row)return;courtDragClean();courtPress={row,x,y,touch,id};if(touch)courtPress.timer=setTimeout(courtDragStart,150);
}
function courtDragMove(x,y){const p=courtPress;if(!p)return;if(!courtDrag){if(Math.hypot(x-p.x,y-p.y)>8){if(p.touch)courtDragClean();else courtDragStart();}}if(courtDrag)courtDragPosition(y);}
window.addEventListener('touchstart',ev=>{if(ev.touches.length!==1){courtDragFinish(true);return;}const t=ev.touches[0];courtDragPress(ev,t.clientX,t.clientY,true,t.identifier);},{capture:true,passive:true});
window.addEventListener('touchmove',ev=>{if(!courtPress?.touch)return;const t=[...ev.touches].find(t=>t.identifier===courtPress.id);if(!t||ev.touches.length!==1){courtDragFinish(true);return;}courtDragMove(t.clientX,t.clientY);if(courtDrag)ev.preventDefault();},{capture:true,passive:false});
for(const type of ['touchend','touchcancel'])window.addEventListener(type,ev=>{if(!courtPress?.touch||![...ev.changedTouches].some(t=>t.identifier===courtPress.id))return;if(courtDrag)ev.preventDefault();courtDragFinish(type==='touchcancel');},{capture:true,passive:false});
window.addEventListener('pointerdown',ev=>{if(ev.pointerType==='touch'||ev.button!==0)return;courtDragPress(ev,ev.clientX,ev.clientY,false,ev.pointerId);});
window.addEventListener('pointermove',ev=>{if(!courtPress||courtPress.touch||courtPress.id!==ev.pointerId)return;courtDragMove(ev.clientX,ev.clientY);if(courtDrag)ev.preventDefault();});
for(const type of ['pointerup','pointercancel'])window.addEventListener(type,ev=>{if(courtPress&&!courtPress.touch&&courtPress.id===ev.pointerId)courtDragFinish(type==='pointercancel');});
for(const type of ['blur','hashchange','resize'])window.addEventListener(type,()=>courtDragFinish(true));
window.addEventListener('contextmenu',ev=>{if(courtPress||ev.target.closest('[data-rank-person]'))ev.preventDefault();});
window.addEventListener('click',ev=>{if((courtDrag||Date.now()<courtDragSuppress)&&getRoute()[0]==='court-ranking'){ev.preventDefault();ev.stopImmediatePropagation();}},true);

window.addEventListener('selectstart',ev=>{if(ev.target.closest?.('.court-rank-row')&&!ev.target.closest('select,input,textarea'))ev.preventDefault();},true);
window.addEventListener('dragstart',ev=>{if(ev.target.closest?.('.court-rank-row'))ev.preventDefault();},true);

// Android can start selection after the initial hold; clear only selections
// belonging to this ranking screen, including text-node selection targets.
function courtClearSelection(){
 const selection=window.getSelection?.();if(!selection||selection.isCollapsed)return;
 const inside=node=>{const el=node?.nodeType===3?node.parentElement:node;return !!el?.closest?.('.court-ranking,.court-rank-ghost');};
 if(inside(selection.anchorNode)||inside(selection.focusNode))selection.removeAllRanges();
}
window.addEventListener('selectionchange',courtClearSelection,true);
window.addEventListener('touchstart',ev=>{if(ev.target.closest?.('[data-rank-person]'))courtClearSelection();},{capture:true,passive:true});
</script><script>// Personal shortcuts are scoped to this account and group on this device.
const homeFeatures=[['出欠','attendance','people'],['配車','carpools','car'],['体育館','venues','calendar'],['コート割','courts','people'],['練習メニュー','practice','paper'],['備品','equipment','box'],['配車精算','settlement','paper']];
function homeKey(){return 'club-home-features-v1:'+JSON.stringify([ctx.mode,state.currentUser,state.group.id]);}
function homeSelected(){try{const value=JSON.parse(localStorage.getItem(homeKey())||'[]');return Array.isArray(value)?value.filter(id=>homeFeatures.some(f=>f[1]===id)):[];}catch{return [];}}
const homeOriginal=renderHome;
renderHome=function(){const selected=homeSelected(),links=homeFeatures.filter(f=>selected.includes(f[1])).map(f=>entry(...f)).join('');return homeOriginal().replace('</main>',(links?`<section class="section"><div class="section-head"><h2>よく使う機能</h2><a class="small muted" href="#home-customize">編集</a></div>${links}</section>`:'')+'</main>');};
const homeOperations=renderOperations;
renderOperations=function(){return homeOperations().replace('</main>',entry('ホームをカスタマイズ','home-customize','settings')+'</main>');};
const homeRoute=wfRenderRoute;
wfRenderRoute=function(r,id,extra){const guarded=homeRoute(r,id,extra);if(guarded!==null)return guarded;if(r!=='home-customize')return null;const selected=homeSelected();return shell('ホームをカスタマイズ','operations',`<p class="note">ホームに表示する機能を選択</p><form data-form="home-customize">${homeFeatures.map(([name,id])=>`<label class="row"><input type="checkbox" name="feature" value="${id}" ${selected.includes(id)?'checked':''}><span class="row-main">${name}</span></label>`).join('')}<div class="form-actions"><button class="primary full">保存</button></div></form>`,'operations');};
window.addEventListener('submit',ev=>{if(!ev.target.matches('[data-form="home-customize"]'))return;ev.preventDefault();ev.stopImmediatePropagation();const selected=[...ev.target.querySelectorAll('input[name="feature"]:checked')].map(el=>el.value);try{localStorage.setItem(homeKey(),JSON.stringify(selected));go('home');render();toast('ホームを更新しました');}catch{toast('保存できませんでした。端末の保存設定を確認してください');}},true);
window.addEventListener('click',ev=>{if(ev.target.closest('[data-home-tasks]'))ui.taskTab='self';},true);
if(ctx.ready)render();
</script></body></html>
