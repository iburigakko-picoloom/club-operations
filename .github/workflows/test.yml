name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_server.py tests/test_identity.py
      - run: node --test tests/domain.test.cjs
      - name: Verify generated demo
        run: |
          python tools/build_demo.py
          git diff --exit-code -- club-demo.html
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: isolated-ci-password
      CLUB_TEST_DATABASE_URL: postgresql://club_runtime:isolated-app-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Initialize isolated database
        run: |
          sed "s/\bclub\b/club_qa/g" server/postgres_schema.sql | psql -h localhost -U postgres -v ON_ERROR_STOP=1
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE club_runtime LOGIN PASSWORD 'isolated-app-password'"
      - run: python -m pytest -q tests/test_server.py tests/test_identity.py
