import groovy.json.JsonOutput

plugins { id 'com.android.application' }

def configValue = { name -> System.getenv(name) ?: (project.findProperty(name) ?: '') }

android {
    namespace 'app.cluboperations'
    compileSdk 35
    defaultConfig {
        applicationId 'app.cluboperations'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
        ['FIREBASE_APP_ID', 'FIREBASE_API_KEY', 'FIREBASE_SENDER_ID', 'FIREBASE_PROJECT_ID'].each { name ->
            buildConfigField 'String', name, JsonOutput.toJson(configValue(name))
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
}
