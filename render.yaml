# Free web service + external free Postgres. No paid disk or paid compute.
services:
  - type: web
    name: club-operations
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn server.app:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /api/config
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_URL
        sync: false
      - key: PUSH_WORKER_ENABLED
        value: "0"
      - key: COOKIE_SECURE
        value: "1"
      - key: LINE_LOGIN_ENABLED
        value: "0"
      - key: PASSWORD_LOGIN_ENABLED
        value: "1"
